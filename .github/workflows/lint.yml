name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gmp, bcmath

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Wayfinder's route helpers (resources/js/routes, actions) are generated, not committed.
      - name: Generate Route Helpers
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan package:discover
          php artisan wayfinder:generate --with-form

      # Check only: these fail the build instead of silently fixing files.
      - name: Pint
        run: composer lint:check

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types:check
